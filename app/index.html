<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app</title>
    <script>
      (function () {
        var scale = parseFloat(localStorage.getItem('odometer:ui-text-scale'));
        if (isFinite(scale) && scale >= 0.8 && scale <= 1.15) {
          document.documentElement.style.fontSize = (16 * scale) + 'px';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
